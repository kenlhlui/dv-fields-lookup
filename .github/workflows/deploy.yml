name: Build and Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (defaults to the triggering commit)
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          package-manager: pnpm@11.24.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

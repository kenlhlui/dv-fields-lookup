    and police agencies. (Source: https://hdl.handle.net/10864/12053)
collectorTraining:
  recommendation: Optional
  example: >-
    The interviews were conducted by professional interviewers under the supervision of the
    Institute for Social Science Research. (Source: https://doi.org/10.7910/DVN/SRVIO4); From the
    documentation: "Each staff member was thoroughly trained prior to beginning work on the survey.
    Interviewers received about three days of classroom training plus self-training materials.
    Additional study materials and classroom training were planned throughout the interviewing
    period. Quality control measures, such as editing returns, observing interviews and
    re-interviewing selected households were employed throughout the survey." (Source:
    https://doi.org/10.7910/DVN/YT09KD)

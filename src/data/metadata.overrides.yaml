  bestPracticeDefinition: >-
    Note: This field is a drop-down list; select all that apply. If there is no appropriate option,
    select Other and use the Other Factor Type field.
  recommendation: Optional
  example: Age; Disease state; Strain
studyOtherDesignType:
  recommendation: Optional
studyOtherFactorType:
  recommendation: Optional
subject:
  bestPracticeDefinition: >-
    Note: This field is a drop-down list; select all that apply.

    Tip: Select one or more Subject terms to represent the broad domain or domains the dataset
    relates to.
  recommendation: Required
  example: Social Sciences
subtitle:
  bestPracticeDefinition: >-
    Tip: The subtitle is not included in the auto-generated citation. If you want the subtitle to be
    included in the citation, then you must add it to the Title field in addition to the Subtitle
    field.
  recommendation: Optional
  example: Main Survey
targetSampleActualSize:
  bestPracticeDefinition: >-
    Tip: The research study's actual sample size may be stated in this numeric field for reference
    purposes.
  recommendation: Optional
  example: '1015'
targetSampleSizeFormula:
  bestPracticeDefinition: >-
    Tip: A plain-text, general description of a sample size formula may be stated here for reference
    purposes. This may include particular methodologies, practices, and outcomes from existing
    scholarly literature.
  recommendation: Optional
  example: >-
    Eligible employees who lived within the following FSAs: K6V, K7A, K7C, K7G, K7H, K7K, K7L, K7M,
    K7N, K7P, K7R, K8N, K8P, K8R, K8V, K0E, K0G, K0H, K0K.

  recommendation: Optional
  example: 'Longitudinal; Time series; Longitudinal: Panel'
timePeriodCoveredEnd:
  recommendation: Recommended
  example: '2015-06-21'
timePeriodCoveredStart:
  bestPracticeDefinition: >-
    Time period to which the data refer. This item reflects the time period covered by the data, not
    the dates of coding or making documents machine-readable or the dates the data were collected.
    Also known as span.
  recommendation: Recommended
  example: '2015-03-20'
title:
  example: Social Media Use Among Teens, 2015 [Canada]
topicClassValue:
  bestPracticeDefinition: >-
    Tip: The Keyword field is repeatable. Put each keyword in its own field by pressing the "+"
    button. Tip: In Dataverse metadata, keywords are case sensitive. Use sentence case for free text
    terms (i.e., capitalize the first word and proper nouns). Tip: Use free-text terms or terms from
    a controlled vocabulary in this field to represent specific or granular topics associated with
    the dataset. Think of them like tags. Tip: FAST and RVMFAST are good, general-purpose controlled
    vocabularies adapted from Library of Congress Subject Headings (LCSH). Tip: Geographic place
    names should be entered in the Geospatial metadata section.
  recommendation: Optional
  example: Society and Culture
topicClassVocab:
  bestPracticeDefinition: 'Tip: Use this field when the Topic Classification term is from a controlled vocabulary.'
  recommendation: Optional
  example: Government of Canada Core Subject Thesaurus
topicClassVocabURI:
  bestPracticeDefinition: 'Tip: Use this field when the Topic Classification term is from a controlled vocabulary.'
  recommendation: Optional
  example: https://canada.multites.net/
unitOfAnalysis:
  recommendation: Recommended
  example: Individual; Family; Household
universe:
  recommendation: Recommended
  example: >-
    Canadians aged 12-30 (Source: https://doi.org/10.5683/SP/HY2H1A); Queen's University 2nd year
    medical students who were part of the 2016 Critical Enquiry Course in the School of Medicine and
    agreed to participate in the study. (Source: https://doi.org/10.5683/SP/D6NISS)
weighting:
  recommendation: Recommended
  example: >-
    Rim weighting is used with this file. By region, the file was weighted to census targets on sex
    (wtsex), age (Wtage), and education (Wtedu) using the 2011 census. For this file, a religion
    weight (wtreligion) was also included based on the 2011 National Household Survey (NHS). The
    wtg2 variable includes all of these weights within it. (Source:
    https://doi.org/10.5683/SP/78RONJ); The final sample obtained for each area is not proportional
    to the Alberta population it makes up. For instance, Edmonton is over-sampled as shown by TABLE
    1. Edmonton makes up only 24% of the Alberta population but has 43% of the interviews.
    Therefore, in order to combine the samples for a provincial sample weighting is necessary. The
    weighting factors used for the 1987 survey are as follows: Edmonton 0.558439, Calgary 1.151521,
    and Other Alberta 1.471173. (Source: https://doi.org/10.7939/DVN/10567); wtx used to correctly
    weight respondents against Stats Canada Alberta population estimates (Source:
    https://doi.org/10.7939/DVN/10813)
westLongitude:
  recommendation: Recommended
  example: '-123.265'

datasetLevelErrorNotes:
  recommendation: Optional
  example: >-
    The computerized questionnaire contains many features designed to maximize the quality of the
    data collected. Many edits are built into the questionnaire to compare the reported data with
    unusual values and detect logical inconsistencies. When an edit fails, the interviewer is
    prompted to correct the information (with the respondent's help, if necessary). Once the data
    are transmitted to Head Office, a comprehensive series of processing steps are undertaken for
    the purpose of detailed verification of each questionnaire. Invalid responses are corrected or
    flagged for imputation. Edits were applied at a micro level. Deterministic edits and consistency
    edits were also performed at the micro level. Data was checked for outliers and extreme values
    and were corrected at a micro level when required. (Source: http://hdl.handle.net/11272/10619)

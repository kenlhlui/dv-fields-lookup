astroType:
  bestPracticeDefinition: >-
    Note: This field is a drop-down list; select all that apply. Most of the types originate in the
    Virtual Observatory (VO) Discovery and Provenance Metadata specification. Type values include:
    Image, Mosaic (mosaic of multiple 2-D images), EventList, Spectrum (1-D spectra), Cube (3-D data
    cubes), Table (table of values, at least two columns), Catalog (collection of derived data,
    primarily tabular), LightCurve, Simulation (theoretical simulation or model), Figure, Artwork
    (artists' renderings of astronomical phenomena or objects), Animation, PrettyPicture,
    Documentation, Other (a data object not described by any of the other types), Library
    (collection of published materials), Press Release, Facsimile (digitized facsimile of historical
    document), Historical (historical information about astronomical objects), Observation
    (collection of data objects associated with one or more observations), Object (collection of
    data objects associated with one or more celestial objects), Value (single value), ValuePair
    (keyword-value pair), Survey (collection of observations covering substantial and contiguous
    areas of the sky).
  recommendation: Recommended
  example: Survey; Catalog

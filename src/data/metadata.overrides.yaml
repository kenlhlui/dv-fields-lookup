cleaningOperations:
  recommendation: Optional
  example: >-
    For income data, all respondents are matched to the tax data file unless they refuse to have
    their information linked. Data obtained from the tax file are complete and do not require
    imputation. Income figures are imputed only in the absence of tax data. Donor imputation by the
    nearest neighbour method is generally used and is performed primarily with Statistics Canada's
    Census Edit and Imputation System (CANCEIS). However, amounts received through certain
    government programs such as the universal childcare benefit and child tax benefits are derived
    from other information (e.g., number of children in the household) using a deductive imputation
    method. (Source: http://hdl.handle.net/11272/10619); Physiological data was reviewed for
    outliers. Individual breaths with tidal volume (VT), respiratory rate (RR) or minute ventilation
    (VE) that lay outside the 95% confidence interval for all infants were removed as outliers;
    99.7% of all measured breaths were included in the final analyses. (Source:
    https://doi.org/10.7939/DVN/10910)
collectionMode:
  recommendation: Recommended
  example: >-

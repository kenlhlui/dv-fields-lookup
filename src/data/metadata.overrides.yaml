redshiftType:
  bestPracticeDefinition: >-
    Note: This is not an IVOA-RM element. Tip: The light coming from an object moving away from you
    is redshifted (Doppler effect), which means that the frequency of that light is shifted to a
    lower value. The speed of an object can be computed by measuring the shifts in frequencies of
    peaks in its spectra. Since the Universe is expanding, the more distant an object is, the more
    it is redshifted. For that reason, redshift is used as a unit of distance for the most distant
    objects. This field RedshiftType serves to indicate which part of the spectra was used to
    measure the redshift.
  recommendation: Optional

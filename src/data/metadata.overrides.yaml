deviationsFromSampleDesign:
  recommendation: Optional
  example: >-
    The suitability of Ohio as a research site reflected its similarity to the United States as a
    whole. The evidence extended by Tuchfarber (1988) shows that Ohio is representative of the
    United States in several ways: percent urban and rural, percent of the population that is
    African American, median age, per capita income, percent living below the poverty level, and
    unemployment rate. Although results generated from an Ohio sample are not empirically
    generalizable to the United States, they may be suggestive of what might be expected nationally.
    (Source:
    https://ddialliance.org/Specification/DDI-Codebook/2.5/XMLSchema/field_level_documentation_files/schemas/codebook_xsd_elements/deviat.html);
    Oversample of persons 50 and older Source: https://doi.org/10.7910/DVN/FGTJGO

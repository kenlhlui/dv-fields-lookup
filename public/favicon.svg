<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Dataverse Metadata Field Lookup">
  <title>Dataverse Metadata Field Lookup</title>
  <style>
    /* matches the app: near-black / near-white ink with one blue accent */
    .tile   { fill: #0F0F0F; }
    .ink    { fill: #FFFFFF; }
    .stroke { stroke: #FFFFFF; }
    .accent { fill: #3B82F6; }
    @media (prefers-color-scheme: dark) {
      .tile   { fill: #F5F5F5; }
      .ink    { fill: #0A0A0A; }
      .stroke { stroke: #0A0A0A; }
      .accent { fill: #2563EB; }
    }
  </style>

  <rect class="tile" width="32" height="32" rx="7"/>

  <!-- magnifier handle (drawn first so the lens ring overlaps it cleanly) -->
  <path class="stroke" d="M19.0 19.0 L25.2 25.2" fill="none" stroke-width="4.2" stroke-linecap="round"/>

  <!-- lens interior -->
  <circle class="tile" cx="13.3" cy="13.3" r="7.1"/>

  <!-- metadata field rows: accent row + plain row -->
  <rect class="accent" x="8.7" y="9.9" width="9.2" height="2.4" rx="1.2"/>
  <rect class="ink" x="8.7" y="14.3" width="6.2" height="2.4" rx="1.2"/>

  <!-- lens ring -->
  <circle class="stroke" cx="13.3" cy="13.3" r="7.1" fill="none" stroke-width="2.9"/>
</svg>
